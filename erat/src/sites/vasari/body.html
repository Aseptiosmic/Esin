<div class="probe" id="probe"></div>
<div class="grain" aria-hidden="true"></div>

<header class="top">
  <a href="#" class="lbl box back" id="back">Back / 戻る</a>
  <div class="logo" aria-label="Leon Vasari">
    <span class="zh">莱昂·瓦萨里</span>
    <span class="en">LEON VASARI</span>
  </div>
  <span class="lbl career">CAREER 1958年〜1989年</span>
</header>

<nav class="tabs" id="tabs" aria-label="Decades">
  <span class="ind" id="ind"></span>
  <button type="button" class="lbl" data-dec="all">All / すべて</button>
  <button type="button" class="lbl" data-dec="1950">1950s</button>
  <button type="button" class="lbl" data-dec="1960">1960s</button>
  <button type="button" class="lbl" data-dec="1970">1970s</button>
  <button type="button" class="lbl" data-dec="1980">1980s</button>
</nav>

<section class="shelf" id="shelf" aria-label="Filmography shelf">
  <div class="stage" id="stage"></div>
</section>

<button type="button" class="play" id="play" aria-label="Open film">
  <svg viewBox="0 0 12 12" fill="currentColor" aria-hidden="true"><path d="M2 1.2 10.6 6 2 10.8Z"/></svg>
</button>

<div class="cap" id="cap" aria-live="polite">
  <div class="mask ctitle" id="ctitle"><span>Noon in Ashes</span></div>
  <div class="mask lbl csub" id="csub"><span>HAI NO SHOGO / 灰の正午</span></div>
  <div class="mask cyear" id="cyear"><span>1971</span></div>
</div>

<button type="button" class="arr prev" id="prev" aria-label="Previous film">
  <svg viewBox="0 0 18 10" fill="none" stroke="currentColor" stroke-width="1.2" aria-hidden="true"><path d="M5 1 1 5l4 4M1 5h16"/></svg>
</button>
<button type="button" class="arr next" id="next" aria-label="Next film">
  <svg viewBox="0 0 18 10" fill="none" stroke="currentColor" stroke-width="1.2" aria-hidden="true"><path d="M13 1 17 5l-4 4M17 5H1"/></svg>
</button>

<footer class="foot">
  <span class="lbl">© LEON VASARI. ALL RIGHTS RESERVED.</span>
  <span class="lbl"><a href="#">FB</a> / <a href="#">TW</a></span>
</footer>

<div class="detail" id="detail" role="dialog" aria-modal="true" aria-labelledby="dtitle">
  <button type="button" class="lbl box close" id="close">Close / 閉じる</button>
  <div class="dtop" aria-hidden="true">
    <div class="logo"><span class="zh">莱昂·瓦萨里</span><span class="en">LEON VASARI</span></div>
  </div>
  <div class="dleft">
    <div class="dline"><p class="lbl dsub" id="dsub"></p></div>
    <div class="dline"><h1 class="dtitle" id="dtitle"></h1></div>
    <div class="dline"><p class="lbl dmeta" id="dmeta"></p></div>
    <div class="dline"><p class="dsyn" id="dsyn"></p></div>
    <div class="dline"><p class="dcred">Written and directed by Leon Vasari. 監督作品</p></div>
    <div class="dline"><button type="button" class="lbl watch">Watch the film / 映画を見る</button></div>
  </div>
  <div class="dright">
    <svg class="poster" viewBox="0 0 474 900" aria-hidden="true">
      <defs>
        <filter id="ink" x="-40%" y="-40%" width="180%" height="180%" filterUnits="userSpaceOnUse">
          <feTurbulence type="fractalNoise" baseFrequency=".011" numOctaves="3" seed="7" result="n"/>
          <feDisplacementMap in="SourceGraphic" in2="n" scale="120" xChannelSelector="R" yChannelSelector="G"/>
        </filter>
        <mask id="inkm" maskUnits="userSpaceOnUse" x="-200" y="-200" width="874" height="1300">
          <rect x="-200" y="-200" width="874" height="1300" fill="#000"/>
          <g filter="url(#ink)" fill="#fff" id="blobs">
            <circle cx="150" cy="330" r="0"/>
            <circle cx="340" cy="600" r="0"/>
            <circle cx="250" cy="120" r="0"/>
            <circle cx="90" cy="760" r="0"/>
            <circle cx="400" cy="250" r="0"/>
            <circle cx="260" cy="860" r="0"/>
            <circle cx="230" cy="470" r="0"/>
          </g>
        </mask>
      </defs>
      <image id="pimg" x="0" y="0" width="474" height="900" preserveAspectRatio="none" mask="url(#inkm)"/>
    </svg>
  </div>
</div>

<div class="cur" id="cur" aria-hidden="true">
  <span class="ring"></span>
  <span class="dot"></span>
  <span class="txt">OPEN<br/>開く</span>
</div>
